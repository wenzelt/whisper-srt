[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whisper-srt"
version = "0.1.0"
description = "Local SRT subtitle generator for Apple M1"
requires-python = ">=3.10"
dependencies = [
    "mlx-whisper>=0.4.0",
    "tqdm>=4.60",
]

[project.scripts]
whisper-srt = "whisper_srt.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
fixable = ["ALL"]
extend-ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["whisper_srt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=whisper_srt --cov-report=term-missing"
markers = [
    "integration: marks tests as integration tests (deselect with '-m not integration')",
]
